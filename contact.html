<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
  </head>
  <body>
    <body>
    <header>
    	<h1> Contact </h1>
	</header>


	<nav>
		<a href="index.html">Acasă</a>
      	<a href="contact.html">Contact</a>
    </nav>

    <main>
      <section>

        <h2> Formular de contact</h2>
      
      </section>

      <p> Completeaza pentru a ne transmite un mesaj</p>

      <form>
        <p> <label> Nume </label> <input type="text" id=nume name="nume"></p>
        <p> <label> Email </label> <input type="email" id=email name="email"></p>
        <p> <label> Activitate profesionala </label> 
          
          <select id=activitate name="activitate">
            <option value="comunicare"> Comunicare </option>
            <option value="marketing"> Marketing </option>
            <option value="drept"> Drept </option>

          </select>
        </p>

          <p> <label> Mesaj </label> 
          
          <textarea id=mesaj name="mesaj" rows="4"> </textarea>
            
        </p>

        <button type="button"> Formular exemplu </button>
        
      </form>

    </main>
    <footer>

      <p> Proiect realizat la disciplina Introducere in Web Design </p>
      
    </footer>
      
    <script src="./script.js"></script>
  </body>
</html>
